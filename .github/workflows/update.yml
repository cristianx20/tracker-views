name: Update views

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza yt-dlp
        run: pip install yt-dlp

      - name: Trage view-urile
        run: python run.py

      - name: Salveaza rezultatul
        run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json channels.json
          git commit -m "update views" || echo "nimic de comis"
          git push
